<svg aria-hidden="true" focusable="false" xmlns="http://www.w3.org/2000/svg" id="hello" viewBox="0 0 64 64" fill="none">
  <defs>
    <linearGradient id="shell" x1="23" y1="16" x2="44" y2="57" gradientUnits="userSpaceOnUse">
      <stop stop-color="#F4FFFC"/><stop offset=".6" stop-color="#D5F8ED"/><stop offset="1" stop-color="#9AE5CF"/>
    </linearGradient>
    <linearGradient id="screen" x1="22" y1="25" x2="40" y2="46" gradientUnits="userSpaceOnUse">
      <stop stop-color="#304C50"/><stop offset="1" stop-color="#20383D"/>
    </linearGradient>
  </defs>
  <style>
    .antenna { transform-origin: 32px 17px; animation: listen 4.8s ease-in-out infinite; }
    .gaze { animation: curious 8.4s ease-in-out infinite; }
    .eyes { transform-origin: 32px 33.5px; animation: blink 6s ease-in-out infinite; }
    .hand { transform-origin: 50px 35px; }
    .left-hand { transform-origin: 13px 36px; animation: balance 4.8s ease-in-out infinite; }
    .launcher.attentive .hand { animation: wave 1.8s cubic-bezier(.45,0,.25,1) both; }
    .launcher.attentive .gaze { animation: none; transform: translateY(-.7px); }
    .launcher.attentive .antenna { animation: perk 1.2s ease-in-out both; }
    @keyframes blink { 0%, 43%, 47%, 100% { transform: scaleY(1); } 45% { transform: scaleY(.1); } }
    @keyframes curious {
      0%, 18%, 52%, 100% { transform: translate(0,0); }
      24%, 40% { transform: translate(1.3px,-.6px); }
      68%, 80% { transform: translate(-.8px,.3px); }
    }
    @keyframes listen { 0%, 100% { transform: rotate(-5deg); } 50% { transform: rotate(7deg); } }
    @keyframes balance { 0%, 100% { transform: rotate(0); } 50% { transform: rotate(9deg); } }
    @keyframes perk { 0%, 100% { transform: rotate(0); } 28% { transform: rotate(13deg); } 62% { transform: rotate(-6deg); } }
    @keyframes wave {
      0%, 100% { transform: rotate(0); }
      18% { transform: rotate(-115deg); }
      32% { transform: rotate(-65deg); }
      46% { transform: rotate(-115deg); }
      60% { transform: rotate(-65deg); }
      74% { transform: rotate(-110deg); }
      86% { transform: rotate(-65deg); }
    }
    @media (prefers-reduced-motion: reduce) {
      .antenna, .gaze, .eyes, .left-hand, .launcher.attentive .hand, .launcher.attentive .gaze, .launcher.attentive .antenna { animation: none; transform: none; }
    }
  </style>
  <g class="antenna">
    <path d="M32 17c-1-5 0-7 3-9" stroke="#335452" stroke-width="2.2" stroke-linecap="round"/>
    <path d="M33 7c1-4 7-4 11-1-2 5-7 6-11 3Z" fill="#7BDFC0" stroke="#335452" stroke-width="1.8" stroke-linejoin="round"/>
    <path d="m36 7 4-.5" stroke="#E4FFF3" stroke-width="1.5" stroke-linecap="round"/>
  </g>
  <path class="left-hand" d="M14 34C10 34 4 37 4 41c0 3 3 4 5 1l5-4" fill="#A5EBD8" stroke="#335452" stroke-width="2.1" stroke-linejoin="round"/>
  <path class="body" d="M32 14C46 14 54 23 54 36c0 8-4 14-10 17l-1 5c-4 1-8-2-11-5-3 3-7 6-11 5l-1-5C14 50 10 44 10 36c0-13 8-22 22-22Z" fill="url(#shell)" stroke="#335452" stroke-width="2.2" stroke-linejoin="round"/>
  <path d="M17 24c3-5 8-7 14-7" stroke="#FFF" stroke-width="2.8" stroke-linecap="round"/>
  <path d="M49 43c-2 5-6 7-10 7" stroke="#85D9C0" stroke-width="2" stroke-linecap="round" opacity=".65"/>
  <g class="hand">
    <path d="M50 34c4 0 10 3 10 7 0 3-3 4-5 1l-5-4" fill="#BCEFE0" stroke="#335452" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="m55 37 2 2" stroke="#F3FFFA" stroke-width="1.8" stroke-linecap="round"/>
  </g>
  <rect x="15" y="24" width="34" height="23" rx="10.5" fill="url(#screen)"/>
  <path d="M20 29c1-2 3-3 6-3h12" stroke="#5B7979" stroke-width="1.3" stroke-linecap="round" opacity=".65"/>
  <g class="gaze">
    <g class="eyes">
      <rect x="22" y="29" width="6" height="9.5" rx="3" fill="#AAFFE4"/>
      <rect x="36" y="29" width="6" height="9.5" rx="3" fill="#AAFFE4"/>
      <path d="M24 31v2m14-2v2" stroke="#F2FFF9" stroke-width="1.7" stroke-linecap="round"/>
    </g>
    <path d="M29.5 40c1.5 2 3.5 2 5 0" stroke="#CBFFEE" stroke-width="1.8" stroke-linecap="round"/>
  </g>
  <path d="M20 40h3m18 0h3" stroke="#F2B8BC" stroke-width="2.4" stroke-linecap="round" opacity=".9"/>
  <path d="m30 50 2 1 2-1" stroke="#6DBEA7" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
